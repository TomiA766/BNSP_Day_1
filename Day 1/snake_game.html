
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #17202a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 30px 10px;
    }

    h1 {
      color: #4ade80;
    }

    canvas {
      background: #111827;
      border: 3px solid #4ade80;
      max-width: 100%;
      height: auto;
    }

    button {
      padding: 10px 20px;
      margin: 12px;
      border: none;
      border-radius: 6px;
      background: #4ade80;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #22c55e;
    }
  </style>
</head>

<body>
  <h1>🐍 Snake Game</h1>
  <p>Skor: <span id="score">0</span></p>

  <canvas id="game" width="400" height="400"></canvas>

  <p>Gunakan tombol panah ⬆ ⬇ ⬅ ➡ untuk bergerak.</p>
  <button onclick="restartGame()">Mulai Ulang</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const size = 20;
    const cells = canvas.width / size;

    let snake, food, dx, dy, score, gameOver, timer;

    function restartGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      food = { x: 15, y: 10 };
      dx = 1;
      dy = 0;
      score = 0;
      gameOver = false;

      document.getElementById("score").textContent = score;

      clearInterval(timer);
      draw();
      timer = setInterval(update, 120);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Menggambar makanan
      ctx.fillStyle = "#f87171";
      ctx.fillRect(
        food.x * size,
        food.y * size,
        size - 2,
        size - 2
      );

      // Menggambar ular
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";
        ctx.fillRect(
          part.x * size,
          part.y * size,
          size - 2,
          size - 2
        );
      });
    }

    function update() {
      if (gameOver) return;

      const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
      };

      const eating = head.x === food.x && head.y === food.y;

      // Periksa tabrakan dengan dinding
      if (
        head.x < 0 || head.x >= cells ||
        head.y < 0 || head.y >= cells
      ) {
        endGame();
        return;
      }

      // Periksa tabrakan dengan tubuh ular
      const body = eating ? snake : snake.slice(0, -1);

      if (body.some(part =>
        part.x === head.x && part.y === head.y
      )) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score += 10;
        document.getElementById("score").textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(part =>
        part.x === food.x && part.y === food.y
      ));
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);

      ctx.fillStyle = "white";
      ctx.font = "bold 30px Arial";
      ctx.textAlign = "center";
      ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.font = "16px Arial";
      ctx.fillText(
        "Klik Mulai Ulang untuk bermain lagi",
        canvas.width / 2,
        canvas.height / 2 + 30
      );
    }

    document.addEventListener("keydown", function(event) {
      const keys = [
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"
      ];

      if (keys.includes(event.key)) {
        event.preventDefault();
      }

      if (event.key === "ArrowUp" && dy !== 1) {
        dx = 0; dy = -1;
      } else if (event.key === "ArrowDown" && dy !== -1) {
        dx = 0; dy = 1;
      } else if (event.key === "ArrowLeft" && dx !== 1) {
        dx = -1; dy = 0;
      } else if (event.key === "ArrowRight" && dx !== -1) {
        dx = 1; dy = 0;
      }
    });

    restartGame();
  </script>
</body>
</html>
